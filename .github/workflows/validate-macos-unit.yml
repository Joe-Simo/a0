name: validate-macos-unit
# Whole unit suite on an actual macOS runtime, separate from diff-scoped heavy gates.
# No repository cache or artifact uploads; standard public runner only.
on:
  workflow_dispatch:
  push:
    branches: ['validation/macos-unit-*']
permissions:
  contents: read
jobs:
  unit:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
          no-cache: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - run: softwareupdate --install-rosetta --agree-to-license || true
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - name: Whole unit suite
        timeout-minutes: 60
        run: node --test dist/test/*.test.js
