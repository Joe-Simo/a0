name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Toolchains (clang, lld, gcc, Icarus, Yosys)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld gcc g++ iverilog yosys
          clang --version | head -1; gcc --version | head -1; iverilog -V | head -1; yosys -V
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - name: Corpus verification (8 software paths)
        run: bun run verify
      - name: Hardware simulation + synthesis
        run: bun run hw
      - name: .NET
        env:
          A0_DOTNET: dotnet
        run: bun run dotnet
      - name: Life application acceptance
        run: bun run app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: results
          path: results/
  # Style and strict audit of Formula/a0.rb through a local tap (this repository is the tap).
  formula:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Tap this repository
        run: brew tap Joe-Simo/a0 "$GITHUB_WORKSPACE"
      - run: brew style Joe-Simo/a0/a0
      - run: brew audit --strict --new Joe-Simo/a0/a0
