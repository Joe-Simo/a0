name: validate-windows-unit
# Existing available unit checks on a standard Windows runner; not a release gate.
# Keep logs in the job and disable persistent caches/artifacts.
on:
  workflow_dispatch:
  push:
    branches: ['validation/windows-unit-*']
permissions:
  contents: read
jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
          no-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - uses: msys2/setup-msys2@cafece8e6baf9247cf9b1bf95097b0b983cc558d # v2.31.0
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          cache: false
          install: >-
            diffutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-winpthreads
      - name: Existing lint, types and available unit checks
        shell: msys2 {0}
        env:
          A0_DOTNET: dotnet
        run: |
          set -euo pipefail
          mkdir -p .a0-tmp/windows-unit
          export TMPDIR="$(pwd)/.a0-tmp/windows-unit"
          export TMP="$(cygpath -w "$TMPDIR")" TEMP="$(cygpath -w "$TMPDIR")"
          export A0_CLANG="$(cygpath -w /ucrt64/bin/clang.exe)"
          export A0_CLANGXX="$(cygpath -w /ucrt64/bin/clang++.exe)"
          node -p 'process.platform + "/" + process.arch'
          bun install --frozen-lockfile
          bun run lint
          bun run typecheck
          # Preserve test execution and exit status; bound console diagnostics so
          # large assertion values cannot make the job log unreadable by clients.
          test_status=0
          bun run test > .a0-tmp/windows-unit/tests.log 2>&1 || test_status=$?
          summary_status=0
          node --input-type=module <<'JS' || summary_status=$?
          import { createReadStream } from 'node:fs';
          import { createInterface } from 'node:readline';
          import { stripVTControlCharacters } from 'node:util';
          const reader = createInterface({ input: createReadStream('.a0-tmp/windows-unit/tests.log') });
          const names = [], details = [], counts = [], tail = [];
          let nameBytes = 0, detailBytes = 0, blocks = 0, capture = 0, omitted = 0;
          for await (const line of reader) {
            const text = stripVTControlCharacters(line);
            const short = text.slice(0, 500);
            if (/^\s*(?:not ok \d+|✖ )/.test(text)) {
              if (nameBytes + short.length <= 40000) { names.push(short); nameBytes += short.length; }
              else omitted++;
              if (blocks++ < 8) capture = 32;
            }
            if (capture > 0) {
              if (detailBytes + short.length <= 100000) { details.push(short); detailBytes += short.length; }
              capture--;
            }
            if (/^(?:# |ℹ )(tests|suites|pass|fail|cancelled|skipped|todo|duration_ms)\b/.test(text)) counts.push(short);
            tail.push(short);
            if (tail.length > 30) tail.shift();
          }
          console.log('Bounded failure names and first eight diagnostic blocks; raw output remains in the ephemeral runner.');
          console.log(names.join('\n'));
          if (omitted) console.log(`Additional failure names omitted from console: ${omitted}`);
          console.log(details.join('\n'));
          console.log('Terminal summary:\n' + counts.join('\n'));
          console.log('Final output lines:\n' + tail.join('\n'));
          JS
          if [[ "$test_status" -ne 0 ]]; then exit "$test_status"; fi
          exit "$summary_status"
