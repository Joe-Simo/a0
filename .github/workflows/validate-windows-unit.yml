name: validate-windows-unit
# Existing available unit checks on a standard Windows runner; not a release gate.
# Keep logs in the job and disable persistent caches/artifacts.
on:
  workflow_dispatch:
  push:
    branches: ['validation/windows-unit-*']
permissions:
  contents: read
jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
          no-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - uses: msys2/setup-msys2@cafece8e6baf9247cf9b1bf95097b0b983cc558d # v2.31.0
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          cache: false
          install: >-
            diffutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-winpthreads
      - name: Existing lint, types and available unit checks
        shell: msys2 {0}
        env:
          A0_DOTNET: dotnet
        run: |
          set -euo pipefail
          mkdir -p .a0-tmp/windows-unit
          export TMPDIR="$(pwd)/.a0-tmp/windows-unit"
          export TMP="$(cygpath -w "$TMPDIR")" TEMP="$(cygpath -w "$TMPDIR")"
          export A0_CLANG="$(cygpath -w /ucrt64/bin/clang.exe)"
          export A0_CLANGXX="$(cygpath -w /ucrt64/bin/clang++.exe)"
          node -p 'process.platform + "/" + process.arch'
          bun install --frozen-lockfile
          bun run lint
          bun run typecheck
          bun run test
