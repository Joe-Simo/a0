name: validate-macos-number
# Isolate the unchanged decimal-conversion oracle from unrelated concurrent tests.
on:
  workflow_dispatch:
  push:
    branches: ['validation/macos-number-*']
permissions:
  contents: read
jobs:
  number:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
          no-cache: true
      - name: Require native Intel macOS
        run: node -e "require('node:assert/strict').equal(process.platform + '/' + process.arch, 'darwin/x64')"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Unchanged decimal conversion oracle
        run: node --test dist/test/number-integer.test.js
