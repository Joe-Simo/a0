name: validate-metal-loops
# Bounded Metal correctness checks on both hosted Mac architectures, not a release gate.
on:
  workflow_dispatch:
  push:
    branches: ['validation/metal-loops-*']
permissions:
  contents: read
jobs:
  metal:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, arch: arm64 }
          - { os: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
          no-cache: true
      - name: Verify hosted architecture
        env:
          A0_EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e "const a=require('node:assert/strict');a.equal(process.platform,'darwin');a.equal(process.arch,process.env.A0_EXPECTED_ARCH)"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Scalar-loop and cache regressions
        run: node --test dist/test/metal-loop-state.test.js
      - name: Existing Metal behavior table
        run: node dist/tools/behavior.js --targets=metal --no-write
      - name: Existing independent Metal corpus
        run: node dist/tools/gpu-verify.js
