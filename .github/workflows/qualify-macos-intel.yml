name: qualify-macos-intel
# Whole unit suite on an actual macOS runtime, separate from diff-scoped heavy gates.
# No repository cache or artifact uploads; standard public runner only.
on:
  workflow_dispatch:
  push:
    branches: ['validation/macos-intel-*']
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        suite: [reader, other]
    runs-on: macos-15-intel
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
          no-cache: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Require native Intel macOS
        run: node -e "require('node:assert/strict').equal(process.platform + '/' + process.arch, 'darwin/x64')"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - name: Complete unit partition
        timeout-minutes: 60
        env:
          A0_TEST_PARTITION: ${{ matrix.suite }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readdirSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const all = readdirSync('dist/test').filter(name => name.endsWith('.test.js')).sort();
          const reader = all.filter(name => name === 'dense-a0.test.js');
          const other = all.filter(name => name !== 'dense-a0.test.js');
          assert.equal(reader.length, 1);
          assert.ok(other.length > 0);
          assert.deepEqual([...reader, ...other].sort(), all);
          const suite = process.env.A0_TEST_PARTITION;
          assert.ok(suite === 'reader' || suite === 'other');
          const selected = suite === 'reader' ? reader : other;
          console.log(JSON.stringify({ suite, allFileCount: all.length, selected }));
          const result = spawnSync(process.execPath, ['--test', ...selected.map(name => 'dist/test/' + name)], { stdio: 'inherit' });
          if (result.error) throw result.error;
          process.exit(result.status ?? 1);
          JS
  verify:
    needs: unit
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both complete unit partitions
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
        run: test "$UNIT_RESULT" = success
