name: release
# Push a tag vX.Y.Z (see docs/RELEASING.md). Tags only: the commit this workflow pushes to main
# does not start another run.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    # Publishing is the owner's: a fork that pushes a tag must not try to publish.
    if: github.repository == 'Joe-Simo/a0'
    # macOS so the darwin binaries get ad-hoc signed by tools/release.sh.
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write # create the release, upload its assets, push the formula to main
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Version and tag checks
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          # The binaries report the version baked into the tagged commit, so it must already be there.
          bun tools/set-version.ts --check "${GITHUB_REF_NAME#v}"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $GITHUB_REF_NAME is not on main" >&2; exit 1; }
          grep -q "^# A0 v${GITHUB_REF_NAME#v}\$" RELEASE_NOTES.md || { echo "RELEASE_NOTES.md has no '# A0 $GITHUB_REF_NAME' heading" >&2; exit 1; }
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      # Five binaries, five MCP Bundles, release/server.json (bundle URLs and SHA-256), checksums.txt.
      - name: Build artifacts
        run: sh tools/release.sh "$VERSION"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "A0 $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "A0 $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber \
            release/a0-darwin-arm64 release/a0-darwin-x64 release/a0-linux-arm64 release/a0-linux-x64 release/a0-windows-x64.exe \
            release/a0-mcp-darwin-arm64.mcpb release/a0-mcp-darwin-x64.mcpb release/a0-mcp-linux-arm64.mcpb \
            release/a0-mcp-linux-x64.mcpb release/a0-mcp-windows-x64.mcpb \
            release/checksums.txt release/server.json
          # Fail unless every expected asset is on the release.
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | LC_ALL=C sort > "$RUNNER_TEMP/assets.txt"
          printf '%s\n' a0-darwin-arm64 a0-darwin-x64 a0-linux-arm64 a0-linux-x64 a0-windows-x64.exe \
            a0-mcp-darwin-arm64.mcpb a0-mcp-darwin-x64.mcpb a0-mcp-linux-arm64.mcpb a0-mcp-linux-x64.mcpb a0-mcp-windows-x64.mcpb \
            checksums.txt server.json | LC_ALL=C sort > "$RUNNER_TEMP/expected.txt"
          diff "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/assets.txt"
      # main gets the formula's version and sha256 values and the registry manifest's bundles (the other
      # version files were bumped before tagging and checked above).
      # The checkout uses this job's own GITHUB_TOKEN; no other secret is involved.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          path: main-tree
      - name: Update main (Formula/a0.rb and server.json)
        working-directory: main-tree
        run: |
          sh ../tools/homebrew-formula.sh "$VERSION" ../release/checksums.txt Formula/a0.rb
          node -e 'const fs=require("node:fs");const [rel,dst]=process.argv.slice(1);const r=JSON.parse(fs.readFileSync(rel,"utf8"));const d=JSON.parse(fs.readFileSync(dst,"utf8"));d.version=r.version;d.packages=r.packages;fs.writeFileSync(dst,JSON.stringify(d,null,2)+"\n")' ../release/server.json server.json
          ../node_modules/.bin/biome format --write server.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "main already carries $GITHUB_REF_NAME"
          else
            git commit -m "Release $GITHUB_REF_NAME: Formula/a0.rb checksums and server.json bundles"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
  # After the upload: install the released binary on each platform through the real install script
  # (which verifies SHA-256 against the release's checksums.txt) and exercise it.
  smoke:
    needs: release
    if: github.repository == 'Joe-Simo/a0'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # arm64
          - os: macos-15-intel # x64
          - os: ubuntu-24.04-arm
          - os: ubuntu-24.04
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install with install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export A0_INSTALL_DIR="$RUNNER_TEMP/a0-bin"
          curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_REF_NAME/install.sh" | A0_VERSION="$GITHUB_REF_NAME" sh
          echo "A0_BIN=$A0_INSTALL_DIR/a0" >> "$GITHUB_ENV"
      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:A0_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'a0-bin'
          $env:A0_VERSION = $env:GITHUB_REF_NAME
          irm "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_REF_NAME/install.ps1" | iex
          "A0_BIN=$(Join-Path $env:A0_INSTALL_DIR 'a0.exe')" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: a0 --version, check, run, MCP initialize and tools/list
        shell: bash
        run: node tools/smoke.ts "$A0_BIN" "${GITHUB_REF_NAME#v}"
