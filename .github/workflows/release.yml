name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    # macOS so the darwin binaries get ad-hoc signed by tools/release.sh.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build standalone binaries
        run: sh tools/release.sh
      - name: Checksums
        working-directory: release
        run: shasum -a 256 a0-* > checksums.txt && cat checksums.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "A0 $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release/a0-* release/checksums.txt --clobber
      - name: Update Homebrew formula on main (sha256 per OS/arch)
        run: |
          git checkout main
          sh tools/homebrew-formula.sh "${GITHUB_REF_NAME#v}" release/checksums.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging/homebrew/a0.rb
          git diff --cached --quiet || { git commit -m "Homebrew formula for $GITHUB_REF_NAME" && git push origin main; }
      - name: Push formula to tap Joe-Simo/homebrew-a0
        if: ${{ env.TAP_TOKEN != '' }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/Joe-Simo/homebrew-a0.git" tap
          mkdir -p tap/Formula
          cp packaging/homebrew/a0.rb tap/Formula/a0.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/a0.rb
          git diff --cached --quiet || { git commit -m "a0 $GITHUB_REF_NAME" && git push; }
