name: gate-macos
# Runs the full gate (tools/dev/a0-dev.ts gate) on Apple silicon for a branch pushed as gate/<name>, so branches built on
# Windows or Linux can clear the steps that need macOS (bootstrap's arm64 stage, selfhost-arm64, the arm64 behavior
# targets). Logs/results are uploaded. gate/publish-* or prepare_merge also runs the normal merge pipeline locally
# and uploads a Git bundle plus tree-bound gate notes. Repository permissions stay read-only; nothing is pushed.
on:
  workflow_dispatch:
    inputs:
      prepare_merge:
        description: Prepare a verified merge bundle for local publication (never pushes)
        type: boolean
        default: false
      diagnose_macos_tests:
        description: Run tests except the slow dense reader before the full gate
        type: boolean
        default: false
  push:
    branches: ['gate/**']
permissions:
  contents: read
jobs:
  gate:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - run: softwareupdate --install-rosetta --agree-to-license || true
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Diagnose macOS tests
        if: ${{ inputs.diagnose_macos_tests }}
        shell: bash
        run: |
          tests=()
          for file in dist/test/*.test.js; do
            if [[ "$file" != dist/test/dense-a0.test.js ]]; then
              tests+=("$file")
            fi
          done
          node --test --test-concurrency=2 "${tests[@]}"
      - name: Full gate
        shell: bash
        env:
          A0_GATE_SCRATCH: ${{ runner.temp }}/a0-gate
        run: |
          set -o pipefail
          mkdir -p "$A0_GATE_SCRATCH"
          dump_gate_logs() {
            gate_status=$?
            if [ "$gate_status" -ne 0 ]; then
              find "$A0_GATE_SCRATCH" -type f -name '*.log' -print -exec cat {} \; || true
            fi
            exit "$gate_status"
          }
          trap dump_gate_logs EXIT
          node dist/tools/dev/a0-dev.js gate 2>&1 | tee gate.log
          grep -q "GATE RESULT: pass" gate.log
      - name: Prepare verified merge bundle
        if: startsWith(github.ref, 'refs/heads/gate/publish-') || (github.event_name == 'workflow_dispatch' && inputs.prepare_merge)
        shell: bash
        env:
          A0_GATE_SUBJECT: ${{ github.sha }}
          A0_GATE_SCRATCH: ${{ runner.temp }}/a0-gate
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge-base --is-ancestor origin/main "$A0_GATE_SUBJECT"
          git rev-parse origin/main > "$RUNNER_TEMP/merge-base.sha"
          # Preserve the actual verification reports before restoring generated files for the merge.
          cp -R results "$A0_GATE_SCRATCH/verified-results"
          git diff --exit-code -- . ':!results'
          git restore --worktree -- results
          test -z "$(git status --porcelain --untracked-files=no)"
          git branch gate-candidate "$A0_GATE_SUBJECT"
          git switch --create gate-merged origin/main
          node dist/tools/dev/a0-dev.js plan --base=origin/main gate-candidate | tee "$RUNNER_TEMP/merge-plan.log"
          node dist/tools/dev/a0-dev.js drive --base=origin/main --merge gate-candidate | tee "$RUNNER_TEMP/merge.log"
          grep -q "GATE RESULT: pass" "$RUNNER_TEMP/merge.log"
          # The integrated code must be the tested candidate; only generated reports may differ.
          git diff --exit-code "$A0_GATE_SUBJECT" HEAD -- . ':!results'
          git merge-base --is-ancestor "$A0_GATE_SUBJECT" HEAD
          test -z "$(git status --porcelain --untracked-files=no)"
          git rev-parse HEAD > "$RUNNER_TEMP/merge-head.sha"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/merge-tree.sha"
          git rev-parse "$A0_GATE_SUBJECT" > "$RUNNER_TEMP/merge-subject.sha"
          git bundle create "$RUNNER_TEMP/merge.bundle" gate-merged refs/notes/a0-gate ^origin/main
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gate-${{ github.run_id }}
          path: |
            gate.log
            results/
            ${{ runner.temp }}/a0-gate/
            ${{ runner.temp }}/merge.bundle
            ${{ runner.temp }}/merge-base.sha
            ${{ runner.temp }}/merge-head.sha
            ${{ runner.temp }}/merge-tree.sha
            ${{ runner.temp }}/merge-subject.sha
            ${{ runner.temp }}/merge-plan.log
            ${{ runner.temp }}/merge.log
