name: gate-macos
# Runs the full gate (tools/dev/a0-dev.ts gate) on Apple silicon for a branch pushed as gate/<name>, so branches built on
# Windows or Linux can clear the steps that need macOS (bootstrap's arm64 stage, selfhost-arm64, the arm64 behavior
# targets). It only reports: the log and results are uploaded as an artifact, nothing is committed or merged.
on:
  workflow_dispatch:
    inputs:
      diagnose_macos_tests:
        description: Run tests except the slow dense reader before the full gate
        type: boolean
        default: false
  push:
    branches: ['gate/**']
permissions:
  contents: read
jobs:
  gate:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - run: softwareupdate --install-rosetta --agree-to-license || true
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Diagnose macOS tests
        if: ${{ inputs.diagnose_macos_tests }}
        shell: bash
        run: |
          tests=()
          for file in dist/test/*.test.js; do
            if [[ "$file" != dist/test/dense-a0.test.js ]]; then
              tests+=("$file")
            fi
          done
          node --test --test-concurrency=2 "${tests[@]}"
      - name: Full gate
        shell: bash
        env:
          A0_GATE_SCRATCH: ${{ runner.temp }}/a0-gate
        run: |
          set -o pipefail
          mkdir -p "$A0_GATE_SCRATCH"
          dump_gate_logs() {
            gate_status=$?
            if [ "$gate_status" -ne 0 ]; then
              find "$A0_GATE_SCRATCH" -type f -name '*.log' -print -exec cat {} \; || true
            fi
            exit "$gate_status"
          }
          trap dump_gate_logs EXIT
          node dist/tools/dev/a0-dev.js gate 2>&1 | tee gate.log
          grep -q "GATE RESULT: pass" gate.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gate-${{ github.run_id }}
          path: |
            gate.log
            results/
            ${{ runner.temp }}/a0-gate/
