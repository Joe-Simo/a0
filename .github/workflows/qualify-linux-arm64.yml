name: qualify-linux-arm64
# Existing Linux checks on a standard native ARM64 public runner; not a release gate.
# No persistent caches, artifacts or additional permissions.
on:
  workflow_dispatch:
  push:
    branches: ['validation/linux-arm64-*']
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04-arm
    # Native A0 compiler suites build several additional compiler closures and reader corpora.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
          no-cache: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Require native Linux ARM64
        run: node -e "require('node:assert/strict').equal(process.platform + '/' + process.arch, 'linux/arm64')"
      - name: Toolchains (clang, lld, gcc, Icarus, Yosys)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld gcc g++ iverilog yosys
          clang --version | head -1; gcc --version | head -1; iverilog -V | head -1; yosys -V
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
  acceptance:
    runs-on: ubuntu-24.04-arm
    # Native A0 compiler suites build several additional compiler closures and reader corpora.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
          no-cache: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Require native Linux ARM64
        run: node -e "require('node:assert/strict').equal(process.platform + '/' + process.arch, 'linux/arm64')"
      - name: Toolchains (clang, lld, gcc, Icarus, Yosys)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld gcc g++ iverilog yosys
          clang --version | head -1; gcc --version | head -1; iverilog -V | head -1; yosys -V
      - run: bun install --frozen-lockfile
      - name: Corpus verification (8 software paths)
        run: bun run verify
      - name: Hardware simulation + synthesis
        run: bun run hw
      - name: .NET
        env:
          A0_DOTNET: dotnet
        run: bun run dotnet
      - name: Life application acceptance
        run: bun run app
      # Keep validation in job logs; avoid persistent artifact-storage charges.
  verify:
    needs: [unit, acceptance]
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Require every verification job to succeed
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$ACCEPTANCE_RESULT" = success
