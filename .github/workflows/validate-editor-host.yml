name: validate-editor-host
# Real editor on an ephemeral standard public runner. No account, trust grant or cache upload.
on:
  workflow_dispatch:
  push:
    branches: ['validation/editor-host-*']
permissions:
  contents: read
jobs:
  restricted-workspace:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      A0_EDITOR_VERSION: '1.141.2'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
          no-cache: true
      - name: Build the existing extension
        working-directory: editors/vscode
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run build
      - name: Download the pinned official editor into runner scratch
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a0-editor/code"
          curl --fail --location --retry 2 "https://update.code.visualstudio.com/$A0_EDITOR_VERSION/darwin-arm64-dmg/stable" --output "$RUNNER_TEMP/a0-editor/editor.dmg"
          shasum -a 256 "$RUNNER_TEMP/a0-editor/editor.dmg"
          trap 'hdiutil detach "$RUNNER_TEMP/a0-editor/mount" || true' EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/a0-editor/mount" "$RUNNER_TEMP/a0-editor/editor.dmg"
          ditto "$RUNNER_TEMP/a0-editor/mount/Visual Studio Code.app" "$RUNNER_TEMP/a0-editor/code/Visual Studio Code.app"
          hdiutil detach "$RUNNER_TEMP/a0-editor/mount"
          trap - EXIT
          codesign --verify --deep --strict "$RUNNER_TEMP/a0-editor/code/Visual Studio Code.app"
          node -e 'const a=require("node:assert/strict");a.equal(process.platform+"/"+process.arch,"darwin/arm64");a.equal(require(process.env.RUNNER_TEMP+"/a0-editor/code/Visual Studio Code.app/Contents/Resources/app/package.json").version,process.env.A0_EDITOR_VERSION)'
      - name: Restricted workspace registration and server refusal
        run: |
          node tools/qualify-editor-host.mjs "$RUNNER_TEMP/a0-editor/code/Visual Studio Code.app/Contents/MacOS/Electron"
