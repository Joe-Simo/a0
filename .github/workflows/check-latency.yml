name: check-latency
# Edit-check latency, A0 against tsc 5.9, tsgo (TypeScript 7 native preview) and tsc-rs, on the same real code (tools/check-latency.ts,
# docs/design/check-latency-claim.md). tsc-rs ships binaries for Linux x64 and macOS arm64 only, so the Windows partial report
# (results/check-latency-win32-x64.json, committed from a Windows box) cannot include it; this workflow measures ubuntu-24.04 and
# macos-15, uploads one partial report per platform, then validates every partial report (schema, verdict arithmetic, load at or
# below 10, 15 runs) and commits them. A failed or invalid partial report commits nothing. Pushes made with GITHUB_TOKEN do not
# retrigger this workflow.
on:
  workflow_dispatch:
  push:
    paths:
      - 'results/check-latency-win32-x64.json'
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: macos-15
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - name: Install the competitors outside the repository dependencies
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/tools"
          npm init -y
          npm i @typescript/native-preview tsc-rs
          ls node_modules/.bin
      - name: Measure
        run: bun run check-latency --tools "$RUNNER_TEMP/tools" --out results/check-latency-${{ matrix.platform }}.json
      - name: Summary
        run: node dist/tools/check-latency.js table results/check-latency-${{ matrix.platform }}.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: check-latency-${{ matrix.platform }}
          path: results/check-latency-${{ matrix.platform }}.json
  commit:
    needs: measure
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: check-latency-*
          path: results
          merge-multiple: true
      - name: Guard, commit
        run: |
          set -euo pipefail
          # the guard: every partial report must validate (exit 1 otherwise), so nothing invalid or loaded is committed
          node dist/tools/check-latency.js table results/check-latency-win32-x64.json results/check-latency-linux-x64.json results/check-latency-darwin-arm64.json | tee -a "$GITHUB_STEP_SUMMARY"
          git add results/check-latency-linux-x64.json results/check-latency-darwin-arm64.json
          if git diff --cached --quiet; then
            echo "nothing changed; no commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Check latency regenerated on Linux x64 and macOS arm64 (tsc-rs included), partial reports per platform"
          git push origin HEAD:main
