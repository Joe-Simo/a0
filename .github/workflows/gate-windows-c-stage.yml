name: gate-windows-c-stage
# This bounded internal proof keeps public seed/compiler defaults unchanged.
on:
  workflow_dispatch:
  push:
    branches: ['gate/**']
  pull_request:
    paths:
      - 'compiler/**'
      - 'seed/**'
      - 'tools/c-arena-stage.*'
      - 'tools/native/c_arena_stage.c'
      - 'tools/native/arena_runtime.*'
      - 'test/c-arena-stage.test.ts'
      - 'test/fixtures/c-arena-stage/**'
      - '.github/workflows/gate-windows-c-stage.yml'
permissions:
  contents: read
jobs:
  c-stage:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # v2.31.0 tag resolved from https://github.com/msys2/setup-msys2.git.
      - uses: msys2/setup-msys2@cafece8e6baf9247cf9b1bf95097b0b983cc558d # v2.31.0
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-winpthreads
      - name: Prepare development bootstrap and run native controls
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p .a0-tmp/windows-c-stage/tmp
          export TMPDIR="$(pwd)/.a0-tmp/windows-c-stage/tmp"
          export TMP="$(cygpath -w "$TMPDIR")" TEMP="$(cygpath -w "$TMPDIR")"
          export A0_C_STAGE_ARTIFACTS="$(cygpath -w "$(pwd)/.a0-tmp/windows-c-stage/controls")"
          bun install --frozen-lockfile
          bun run build
          CC=clang node dist/tools/c-arena-stage.js --prepare "$(pwd)/.a0-tmp/windows-c-stage/prepared"
          CC=clang node --test --test-name-pattern='C arena stage (preserves|refuses|host)' dist/test/c-arena-stage.test.js 2>&1 | tee .a0-tmp/windows-c-stage/clang-controls.log
          CC=gcc node --test --test-name-pattern='C arena stage host' dist/test/c-arena-stage.test.js 2>&1 | tee .a0-tmp/windows-c-stage/gcc-controls.log
      - name: C-only stage reproduction with UCRT64 GCC and Clang
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH=/ucrt64/bin:/usr/bin
          if command -v node || command -v bun; then
            echo 'C-only phase unexpectedly exposes a JavaScript runtime' >&2
            exit 1
          fi
          export TMPDIR="$(pwd)/.a0-tmp/windows-c-stage/tmp"
          export TMP="$(cygpath -w "$TMPDIR")" TEMP="$(cygpath -w "$TMPDIR")"
          for compiler in gcc clang; do
            CC="$compiler" sh tools/c-arena-stage.sh .a0-tmp/windows-c-stage/prepared ".a0-tmp/windows-c-stage/$compiler"
          done
          cmp .a0-tmp/windows-c-stage/gcc/stage4/module.c .a0-tmp/windows-c-stage/clang/stage4/module.c
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-c-stage
          include-hidden-files: true
          path: |
            .a0-tmp/windows-c-stage/prepared/preparation.json
            .a0-tmp/windows-c-stage/*-controls.log
            .a0-tmp/windows-c-stage/controls/**/*.log
            .a0-tmp/windows-c-stage/controls/**/*.json
            .a0-tmp/windows-c-stage/gcc/
            .a0-tmp/windows-c-stage/clang/
