name: validate-editor-windows
# Isolated real editor on a standard public runner; no trust grant or uploaded cache.
on:
  workflow_dispatch:
  push:
    branches: ['validation/editor-windows-*']
permissions:
  contents: read
jobs:
  restricted-workspace:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      A0_EDITOR_VERSION: '1.141.2'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
          no-cache: true
      - name: Build the existing extension
        working-directory: editors/vscode
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify and run the pinned official editor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'a0-editor'
          New-Item -ItemType Directory -Path $root | Out-Null
          $archive = Join-Path $root 'editor.zip'
          Invoke-WebRequest "https://update.code.visualstudio.com/$env:A0_EDITOR_VERSION/win32-x64-archive/stable" -OutFile $archive
          Get-FileHash -Algorithm SHA256 $archive | Format-List
          $code = Join-Path $root 'code'
          Expand-Archive -LiteralPath $archive -DestinationPath $code
          $editor = Join-Path $code 'Code.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $editor
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(^|,\s*)CN=Microsoft Corporation(,|$)') {
            throw 'The editor must have a valid Microsoft Corporation signature'
          }
          if (Test-Path (Join-Path $code 'data')) { throw 'Portable data must not override the isolated test profile' }
          $version = @(& (Join-Path $code 'bin/code.cmd') --version)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($version.Count -ne 3 -or $version[0].Trim() -ne $env:A0_EDITOR_VERSION -or $version[2].Trim() -ne 'x64') {
            throw 'The editor CLI must report the pinned version and x64 architecture'
          }
          node -e 'require("node:assert/strict").equal(process.platform+"/"+process.arch,"win32/x64")'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/qualify-editor-host.mjs $editor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
