name: qualify-macos-native
# Explicit existing acceptance commands, separate from diff-scoped unit validation.
# Standard public runners only; evidence stays in logs, with no persistent cache/artifact.
on:
  workflow_dispatch:
  push:
    branches: ['validation/macos-native-*']
permissions:
  contents: read
jobs:
  acceptance:
    name: ${{ matrix.entry }}
    runs-on: macos-15
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - { entry: bootstrap, report: bootstrap, minutes: 90 }
          - { entry: bootstrap-arm64, report: bootstrap-arm64, minutes: 90 }
          - { entry: bootstrap-macho, report: bootstrap-macho, minutes: 90 }
          - { entry: selfhost-verify, report: selfhost, minutes: 45 }
          - { entry: verify, report: verification, minutes: 90 }
          - { entry: app, report: app, minutes: 45 }
          - { entry: gpu-verify, report: gpu, minutes: 30 }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
          no-cache: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - run: softwareupdate --install-rosetta --agree-to-license || true
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Run existing acceptance command
        timeout-minutes: ${{ matrix.minutes }}
        shell: bash
        env:
          A0_ACCEPTANCE_ENTRY: ${{ matrix.entry }}
          A0_ACCEPTANCE_REPORT: results/${{ matrix.report }}.json
        run: |
          set -euo pipefail
          # Never print a checked-in historical report if the command fails before writing.
          rm -f "$A0_ACCEPTANCE_REPORT"
          preserve_result() {
            result_status=$?
            git rev-parse HEAD HEAD^{tree} || true
            if [[ -f "$A0_ACCEPTANCE_REPORT" ]]; then
              cat "$A0_ACCEPTANCE_REPORT" || true
            fi
            exit "$result_status"
          }
          trap preserve_result EXIT
          node "dist/tools/$A0_ACCEPTANCE_ENTRY.js"
