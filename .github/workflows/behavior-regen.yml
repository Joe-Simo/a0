name: behavior-regen
# Manual run: regenerates results/behavior.json on an Apple-silicon macOS runner, where the arm64, x86_64 (Rosetta),
# Metal and self-hosted arm64 targets can run, and uploads it as an artifact. Nothing is committed from here;
# download the artifact, check the table, and commit it (AGENTS.md: a target that cannot run is recorded blocked, never as a pass).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  behavior:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - run: softwareupdate --install-rosetta --agree-to-license || true
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run behavior
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: behavior
          path: results/behavior.json
