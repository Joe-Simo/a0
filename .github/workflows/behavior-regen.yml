name: behavior-regen
# Regenerates the macOS half of the behavior table. No single machine runs every target: the Windows partial report
# (results/behavior-win32-x64.json, committed from a Windows box) covers interpreter, js, c, java, dotnet, riscv64, arm32,
# avr, wasm and others; this Apple-silicon runner adds arm64, x86_64 (Rosetta), Metal and the self-hosted arm64 target.
# It then merges both into results/behavior.json (tools/behavior-merge.ts: passed beats blocked, a failure stays failed,
# every target records ranOn) and commits the three files, unless the merge would lose a target that is passed in the
# committed results/behavior.json (tools/behavior-regress-check.ts). Pushes made with GITHUB_TOKEN do not retrigger this workflow.
on:
  workflow_dispatch:
  push:
    paths:
      - 'results/behavior-win32-x64.json'
permissions:
  contents: write
jobs:
  behavior:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - run: softwareupdate --install-rosetta --agree-to-license || true
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Run the macOS partial report
        run: bun run behavior --out results/behavior-darwin-arm64.json
      - name: Merge, guard, commit
        run: |
          set -euo pipefail
          cp results/behavior.json "$RUNNER_TEMP/behavior-committed.json"
          bun tools/behavior-merge.ts --out results/behavior.json \
            results/behavior-win32-x64.json results/behavior-darwin-arm64.json | tee "$RUNNER_TEMP/merge.txt"
          cat "$RUNNER_TEMP/merge.txt" >> "$GITHUB_STEP_SUMMARY"
          bun tools/behavior-regress-check.ts "$RUNNER_TEMP/behavior-committed.json" results/behavior.json
          git add results/behavior-win32-x64.json results/behavior-darwin-arm64.json results/behavior.json
          if git diff --cached --quiet; then
            echo "nothing changed; no commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Behavior table regenerated from the Windows and macOS partial reports (results/behavior.json merged, ranOn recorded per target)"
          git push origin HEAD:main
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: behavior
          path: |
            results/behavior.json
            results/behavior-darwin-arm64.json
