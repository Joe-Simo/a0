name: validate-editor-installed
# Local VSIX only, standard public runners, isolated profiles; no trust changes or uploads.
on:
  workflow_dispatch:
  push:
    branches: ['validation/editor-installed-*']
permissions:
  contents: read
jobs:
  restricted-workspace:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      A0_EDITOR_VERSION: '1.141.2'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4
          no-cache: true
      - name: Package the existing extension
        working-directory: editors/vscode
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run package
      - name: Prepare isolated fixture
        shell: bash
        run: node tools/qualify-editor-installed.mjs prepare "$RUNNER_TEMP/a0-installed"
      - name: Install and check on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a0-editor/code" "$RUNNER_TEMP/a0-editor/mount"
          curl --fail --location --retry 2 "https://update.code.visualstudio.com/$A0_EDITOR_VERSION/darwin-arm64-dmg/stable" --output "$RUNNER_TEMP/a0-editor/editor.dmg"
          shasum -a 256 "$RUNNER_TEMP/a0-editor/editor.dmg"
          trap 'hdiutil detach "$RUNNER_TEMP/a0-editor/mount" || true' EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/a0-editor/mount" "$RUNNER_TEMP/a0-editor/editor.dmg"
          ditto "$RUNNER_TEMP/a0-editor/mount/Visual Studio Code.app" "$RUNNER_TEMP/a0-editor/code/Visual Studio Code.app"
          hdiutil detach "$RUNNER_TEMP/a0-editor/mount"
          trap - EXIT
          app="$RUNNER_TEMP/a0-editor/code/Visual Studio Code.app"
          codesign --verify --deep --strict "$app"
          node -e 'const a=require("node:assert/strict");a.equal(process.platform+"/"+process.arch,"darwin/arm64");a.equal(require(process.env.RUNNER_TEMP+"/a0-editor/code/Visual Studio Code.app/Contents/Resources/app/package.json").version,process.env.A0_EDITOR_VERSION)'
          cli="$app/Contents/Resources/app/bin/code"
          archives=("$GITHUB_WORKSPACE"/editors/vscode/*.vsix)
          test "${#archives[@]}" -eq 1
          "$cli" --user-data-dir "$RUNNER_TEMP/a0-installed/profile" --extensions-dir "$RUNNER_TEMP/a0-installed/extensions" --install-extension "${archives[0]}" --force
          "$cli" --user-data-dir "$RUNNER_TEMP/a0-installed/profile" --extensions-dir "$RUNNER_TEMP/a0-installed/extensions" --list-extensions --show-versions > "$RUNNER_TEMP/a0-installed/installed.txt"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          case "$executable" in ''|'.'|'..'|*/*) exit 1;; esac
          node tools/qualify-editor-installed.mjs run "$RUNNER_TEMP/a0-installed" "$app/Contents/MacOS/$executable"
      - name: Install and check on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'a0-editor'
          New-Item -ItemType Directory -Path $root | Out-Null
          $archive = Join-Path $root 'editor.zip'
          Invoke-WebRequest "https://update.code.visualstudio.com/$env:A0_EDITOR_VERSION/win32-x64-archive/stable" -OutFile $archive
          Get-FileHash -Algorithm SHA256 $archive | Format-List
          $code = Join-Path $root 'code'
          Expand-Archive -LiteralPath $archive -DestinationPath $code
          $editor = Join-Path $code 'Code.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $editor
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(^|,\s*)CN=Microsoft Corporation(,|$)') { throw 'Invalid editor signature' }
          if (Test-Path (Join-Path $code 'data')) { throw 'Portable data must not override the isolated profile' }
          $cli = Join-Path $code 'bin/code.cmd'
          $version = @(& $cli --version)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($version.Count -ne 3 -or $version[0].Trim() -ne $env:A0_EDITOR_VERSION -or $version[2].Trim() -ne 'x64') { throw 'Unexpected editor version or architecture' }
          $fixture = Join-Path $env:RUNNER_TEMP 'a0-installed'
          $archives = @(Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'editors/vscode') -Filter '*.vsix')
          if ($archives.Count -ne 1) { throw 'Expected one packaged extension' }
          & $cli --user-data-dir "$fixture/profile" --extensions-dir "$fixture/extensions" --install-extension $archives[0].FullName --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cli --user-data-dir "$fixture/profile" --extensions-dir "$fixture/extensions" --list-extensions --show-versions | Set-Content -Encoding utf8 (Join-Path $fixture 'installed.txt')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tools/qualify-editor-installed.mjs run $fixture $editor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
